<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AirInput - Virtual Pad</title>

  <link rel="stylesheet" href="global.css">
  <link id="skin-style" rel="stylesheet" href="">

  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <div id="join-screen">
    <h1>🎮 AirInput</h1>
    <input type="text" id="username-input" placeholder="Ingresa tu nombre" maxlength="24" autocomplete="off" />
    <button id="join-btn">Unirse</button>
  </div>

  <button id="btn-settings" style="display: none;" aria-label="Configuración">⚙️</button>
  <div id="status-badge">● 0ms</div>

  <div id="settings-modal">
    <h3>⚙️ Configuración</h3>

    <div class="settings-section">
      <label>Diseño de mando:</label>
      <div class="layout-selector">
        <button onclick="loadSkin('snes')" data-skin="snes" class="sel-btn">Classic (SNES)</button>
        <button onclick="loadSkin('xbox')" data-skin="xbox" class="sel-btn">Modern (Xbox)</button>
        <button onclick="loadSkin('n64')" data-skin="n64" class="sel-btn">Classic (N64)</button>
      </div>
    </div>

    <div class="settings-toggles">
      <div class="toggle-row">
        <span>Girar pantalla al lado opuesto</span>
        <input type="checkbox" id="toggle-portrait-flip" />
      </div>
      <div class="toggle-row">
        <span>Invertir eje Y (Sticks)</span>
        <input type="checkbox" id="toggle-invert-y" />
      </div>
      <div class="toggle-row">
        <span>Vibración háptica</span>
        <input type="checkbox" id="toggle-haptics" checked />
      </div>
      <div class="toggle-row">
        <span>Zona muerta (<span id="deadzone-val">8%</span>)</span>
        <input type="range" id="range-deadzone" min="0" max="30" value="8" />
      </div>
      <div class="toggle-row">
        <span>Pantalla completa</span>
        <button id="btn-toggle-fullscreen" class="sel-btn" style="padding: 4px 10px;">Alternar ⛶</button>
      </div>
    </div>

    <button id="close-settings">Cerrar</button>
  </div>

  <div id="gamepad-container" style="display: none;"></div>

  <script src="script.js"></script>
</body>

</html>
