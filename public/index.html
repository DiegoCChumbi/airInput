<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AirInput — Mando Táctil</title>

  <link rel="stylesheet" href="global.css?v=5">
  <link id="skin-style" rel="stylesheet" href="">

  <script src="/socket.io/socket.io.js"></script>
</head>

<body>

  <!-- Port 1 Hardware Deck (Join Screen) -->
  <div id="join-screen" role="region" aria-label="Conectar mando">
    <div class="chassis-screws top-screws" aria-hidden="true">
      <span class="screw"></span>
      <span class="screw"></span>
    </div>

    <div class="deck-header">
      <div class="deck-brand">
        <span class="brand-mark">AIRINPUT</span>
        <span class="brand-sub">PORT 01 · WIRELESS PAD</span>
      </div>
      <div class="power-module">
        <span id="join-led" class="led-jewel online"></span>
        <span class="led-caption">LINK</span>
      </div>
    </div>

    <div class="cartridge-well">
      <label class="well-label" for="username-input">Identificador de jugador</label>
      <input type="text" id="username-input" placeholder="Ej. P1-CHUMBI" maxlength="24" autocomplete="off" spellcheck="false" />
      <div id="join-feedback" class="join-feedback" aria-live="polite"></div>
    </div>

    <div class="shell-preselector">
      <span class="well-label">Diseño del mando</span>
      <div class="layout-selector">
        <button type="button" onclick="selectInitialSkin('snes')" data-skin="snes" class="sel-btn">
          <span class="shell-dot snes-dot"></span>16-Bit
        </button>
        <button type="button" onclick="selectInitialSkin('n64')" data-skin="n64" class="sel-btn">
          <span class="shell-dot n64-dot"></span>64-Bit
        </button>
        <button type="button" onclick="selectInitialSkin('xbox')" data-skin="xbox" class="sel-btn">
          <span class="shell-dot xbox-dot"></span>Simétrico
        </button>
        <button type="button" onclick="selectInitialSkin('asymmetric')" data-skin="asymmetric" class="sel-btn">
          <span class="shell-dot asym-dot"></span>Asimétrico
        </button>
        <button type="button" onclick="selectInitialSkin('brawler')" data-skin="brawler" class="sel-btn">
          <span class="shell-dot brawler-dot"></span>Brawler
        </button>
        <button type="button" onclick="selectInitialSkin('kart')" data-skin="kart" class="sel-btn">
          <span class="shell-dot kart-dot"></span>Kart
        </button>
        <button type="button" onclick="selectInitialSkin('arcade')" data-skin="arcade" class="sel-btn span-full">
          <span class="shell-dot arcade-dot"></span>Arcade 6-Botones
        </button>
      </div>
    </div>

    <button id="join-btn" type="button">
      <span class="btn-cap">Conectar mando</span>
    </button>

    <div class="chassis-screws bottom-screws" aria-hidden="true">
      <span class="screw"></span>
      <span class="screw"></span>
    </div>
  </div>

  <div id="gamepad-container" style="display: none;">
    <!-- Top Telemetry & Menu Pill (centered between L and R triggers) -->
    <div id="hud-bar">
      <div id="status-badge">
        <span class="led-dot"></span>
        <span id="status-text">0ms</span>
      </div>
      <button id="btn-settings" type="button" aria-label="Menú del mando">
        <span class="gear-bars" aria-hidden="true"></span>
        <span class="btn-settings-label">Menú</span>
      </button>
    </div>

    <div id="skin-stage"></div>
  </div>

  <!-- Hardware DIP-Switch & Shell Configuration Modal -->
  <div id="settings-modal" role="dialog" aria-label="Ajustes de hardware">
    <div class="modal-header">
      <div class="deck-brand">
        <span class="brand-mark">MENÚ DEL MANDO</span>
        <span class="brand-sub">CARCASA &amp; CALIBRACIÓN TÁCTIL</span>
      </div>
      <button id="btn-toggle-fullscreen" type="button" class="hw-mini-btn">Pantalla completa ⛶</button>
    </div>

    <div class="settings-section">
      <label class="well-label">Diseño activo (Clásicos &amp; Touch-First)</label>
      <div class="layout-selector">
        <button type="button" onclick="loadSkin('snes')" data-skin="snes" class="sel-btn">
          <span class="shell-dot snes-dot"></span>16-Bit
        </button>
        <button type="button" onclick="loadSkin('n64')" data-skin="n64" class="sel-btn">
          <span class="shell-dot n64-dot"></span>64-Bit
        </button>
        <button type="button" onclick="loadSkin('xbox')" data-skin="xbox" class="sel-btn">
          <span class="shell-dot xbox-dot"></span>Simétrico
        </button>
        <button type="button" onclick="loadSkin('asymmetric')" data-skin="asymmetric" class="sel-btn">
          <span class="shell-dot asym-dot"></span>Asimétrico
        </button>
        <button type="button" onclick="loadSkin('brawler')" data-skin="brawler" class="sel-btn">
          <span class="shell-dot brawler-dot"></span>Brawler
        </button>
        <button type="button" onclick="loadSkin('kart')" data-skin="kart" class="sel-btn">
          <span class="shell-dot kart-dot"></span>Kart
        </button>
        <button type="button" onclick="loadSkin('arcade')" data-skin="arcade" class="sel-btn span-full">
          <span class="shell-dot arcade-dot"></span>Arcade 6-Botones
        </button>
      </div>
    </div>

    <div class="settings-toggles">
      <label class="toggle-row" for="toggle-portrait-flip">
        <span class="toggle-copy">
          <strong>Invertir giro de pantalla</strong>
          <small>Rota el mando 180° en modo vertical</small>
        </span>
        <span class="dip-switch">
          <input type="checkbox" id="toggle-portrait-flip" />
          <span class="dip-track"><span class="dip-thumb"></span></span>
        </span>
      </label>

      <label class="toggle-row" for="toggle-invert-y">
        <span class="toggle-copy">
          <strong>Invertir eje Y analógico</strong>
          <small>Estilo vuelo para sticks virtuales</small>
        </span>
        <span class="dip-switch">
          <input type="checkbox" id="toggle-invert-y" />
          <span class="dip-track"><span class="dip-thumb"></span></span>
        </span>
      </label>

      <label class="toggle-row" for="toggle-haptics">
        <span class="toggle-copy">
          <strong>Respuesta háptica</strong>
          <small>Pulso físico al presionar botones</small>
        </span>
        <span class="dip-switch">
          <input type="checkbox" id="toggle-haptics" checked />
          <span class="dip-track"><span class="dip-thumb"></span></span>
        </span>
      </label>

      <div class="toggle-row fader-row">
        <span class="toggle-copy">
          <strong>Zona muerta del stick</strong>
          <small>Filtra micro-movimientos (<span id="deadzone-val">8%</span>)</small>
        </span>
        <input type="range" id="range-deadzone" min="0" max="30" value="8" />
      </div>
    </div>

    <button id="close-settings" type="button">Volver al juego</button>
  </div>

  <script src="script.js?v=6"></script>
</body>

</html>
